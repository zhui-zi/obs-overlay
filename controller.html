<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Aura Edition - Overlay Controller</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700;900&family=Noto+Sans+SC:wght@500;700&family=JetBrains+Mono:wght@600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090b0e;
      color: #f8fafc;
      font-family: 'Google Sans', 'Noto Sans SC', sans-serif;
      padding: 30px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .controller-chassis {
      width: 100%;
      max-width: 660px;
      background: rgba(13, 16, 23, 0.94);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* Top rim light */
    .controller-chassis::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(90deg, #60a5fa 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #9b72cb;
      box-shadow: 0 0 14px rgba(155, 114, 203, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    select option {
      background: #0d1017;
      color: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 95px;
      line-height: 1.6;
    }

    .help-hint {
      font-size: 13px;
      color: #64748b;
      margin-top: 6px;
    }

    .button-row {
      display: flex;
      gap: 14px;
      margin-top: 26px;
    }

    button {
      flex: 1;
      padding: 14px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-submit {
      position: relative;
      background: rgba(18, 21, 28, 0.95);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 20px rgba(155, 114, 203, 0.4);
      overflow: visible;
      z-index: 1;
    }

    /* Conic rainbow border */
    .btn-submit::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 12px;
      padding: 2px;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #f59e0b, #4285f4);
      background-size: 200% 100%;
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rainbow-slide 3s linear infinite;
      pointer-events: none;
    }

    /* Rainbow halo */
    .btn-submit::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 14px;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #f59e0b);
      background-size: 200% 100%;
      filter: blur(10px);
      opacity: 0.6;
      z-index: -1;
      animation: rainbow-slide 3s linear infinite;
      pointer-events: none;
    }

    @keyframes rainbow-slide {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .btn-submit:hover {
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .quick-preset-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .preset-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-chip:hover {
      border-color: #9b72cb;
      color: #c4b5fd;
      background: rgba(155, 114, 203, 0.15);
    }

    .alert-toast {
      margin-top: 18px;
      padding: 12px 16px;
      background: rgba(155, 114, 203, 0.2);
      border: 1px solid rgba(155, 114, 203, 0.5);
      color: #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="controller-chassis">
    <div class="header-bar">
      <div class="header-title">
        <span>✨ GEMINI AURA OVERLAY CONTROLLER</span>
      </div>
      <div class="status-badge" id="statusBadge">AURA SYNC: OK</div>
    </div>

    <form id="controlForm">
      <div class="form-group">
        <label>Brand / Channel Name (BrandDomain)</label>
        <input type="text" id="ctrlDomain" value="keita.cc">
        <div class="quick-preset-chips">
          <span class="preset-chip" onclick="setDomain('keita.cc')">keita.cc</span>
          <span class="preset-chip" onclick="setDomain('追子的直播间')">追子的直播间</span>
          <span class="preset-chip" onclick="setDomain('电台互动慢聊')">电台互动慢聊</span>
          <span class="preset-chip" onclick="setDomain('')">（清空隐藏）</span>
        </div>
      </div>

      <div class="form-group">
        <label>Game Title</label>
        <input type="text" id="ctrlGame" value="【游戏】黑神话：悟空">
        <div class="quick-preset-chips">
          <span class="preset-chip" onclick="setGame('【游戏】黑神话：悟空')">【游戏】黑神话</span>
          <span class="preset-chip" onclick="setGame('【游戏】英雄联盟 LOL')">【游戏】LOL</span>
          <span class="preset-chip" onclick="setGame('【观影】星际穿越 Interstellar')">【观影】星际穿越</span>
          <span class="preset-chip" onclick="setGame('【观影】流浪地球 2')">【观影】流浪地球</span>
          <span class="preset-chip" onclick="setGame('【杂谈】夜间电台 / 互动慢聊')">【杂谈】电台慢聊</span>
          <span class="preset-chip" onclick="setGame('【杂谈】周末闲聊茶话会')">【杂谈】闲聊茶话会</span>
          <span class="preset-chip" onclick="setGame('Just Chatting')">无前缀普通标题</span>
        </div>
      </div>

      <div class="form-group">
        <label>Marquee Notices (Newline or || separated)</label>
        <textarea id="ctrlNotices">没啥说的了，都来我家喝酒吧^^b</textarea>
        <div class="help-hint">Each line or || delimiter will loop smoothly across the notice bar.</div>
      </div>

      <div class="form-group">
        <label>Layout Mode</label>
        <select id="ctrlMode">
          <option value="light">Lightweight Mode (Top Capsule HUD)</option>
          <option value="full">Full Stage Mode (Game Frame + Bottom Dock)</option>
        </select>
      </div>

      <div class="form-group">
        <label>OBS Scene Auto-Switch Simulator ([full] / [lite])</label>
        <input type="text" id="ctrlScene" placeholder="e.g. 主游戏机位 [full] or 杂谈互动 [lite]">
        <div class="quick-preset-chips">
          <span class="preset-chip" onclick="setScene('主游戏机位 [full]')">🎮 主游戏机位 [full]</span>
          <span class="preset-chip" onclick="setScene('日常杂谈 [lite]')">☕ 日常杂谈 [lite]</span>
          <span class="preset-chip" onclick="setScene('电竞赛事机位 [full]')">🏆 电竞赛事 [full]</span>
        </div>
      </div>

      <div class="form-group">
        <label>Thematic Atmosphere & Stage Effects</label>
        <select id="ctrlEffect">
          <option value="none">None (Standard Aura)</option>
          <option value="lights">🎄 Festive Garland Lights</option>
          <option value="snow">❄️ Winter Frost & Snowfall</option>
          <option value="both">✨ Garland Lights + Snowfall</option>
          <option value="newyear">🧧 Chinese New Year (Grand Palace Lanterns & Auspicious Gold Dust)</option>
          <option value="halloween">🎃 Halloween Night (Cobweb, Spider, Spooky Tree & Jack-o'-Lantern)</option>
          <option value="romantic">🌸 Romantic Sakura (Blooming Cherry Branches & Hanafubuki Petal Storm)</option>
        </select>
      </div>

      <div class="button-row">
        <button type="submit" class="btn-submit">🚀 Sync to 4K OBS Canvas</button>
      </div>

      <div class="alert-toast" id="toast">✔ Synchronized to OBS canvas</div>
    </form>
  </div>

  <script>
    const channel = new BroadcastChannel('obs_overlay_sync');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2500);
    }

    function setDomain(domain) {
      document.getElementById('ctrlDomain').value = domain;
    }

    function setGame(title) {
      document.getElementById('ctrlGame').value = title;
    }

    function setScene(name) {
      document.getElementById('ctrlScene').value = name;
      const lower = name.toLowerCase();
      if (lower.includes('[full]') || lower.includes('【full】') || lower.includes('[全量]') || lower.includes('【全量】')) {
        document.getElementById('ctrlMode').value = 'full';
      } else if (lower.includes('[lite]') || lower.includes('【lite】') || lower.includes('[light]') || lower.includes('【light】') || lower.includes('[轻量]') || lower.includes('【轻量】')) {
        document.getElementById('ctrlMode').value = 'light';
      }
    }

    document.getElementById('controlForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const brandDomain = document.getElementById('ctrlDomain').value.trim();
      const gameTitle = document.getElementById('ctrlGame').value.trim();
      const rawNotices = document.getElementById('ctrlNotices').value;
      const themeEffect = document.getElementById('ctrlEffect').value;
      const layoutMode = document.getElementById('ctrlMode').value;
      const sceneName = document.getElementById('ctrlScene').value.trim();
      const notices = rawNotices
        .split(/\r?\n|\|\|/)
        .map(s => s.trim())
        .filter(Boolean);

      channel.postMessage({
        brandDomain,
        gameTitle,
        notices,
        themeEffect,
        layoutMode,
        sceneName
      });

      showToast('✔ Synchronized to OBS canvas');
    });
  </script>
</body>
</html>

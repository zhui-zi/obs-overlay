<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Aura Edition - Overlay Controller</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700;900&family=Noto+Sans+SC:wght@500;700&family=JetBrains+Mono:wght@600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090b0e;
      color: #f8fafc;
      font-family: 'Google Sans', 'Noto Sans SC', sans-serif;
      padding: 30px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .controller-chassis {
      width: 100%;
      max-width: 660px;
      background: rgba(13, 16, 23, 0.94);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* Top rim light */
    .controller-chassis::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(90deg, #60a5fa 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #9b72cb;
      box-shadow: 0 0 14px rgba(155, 114, 203, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    select option {
      background: #0d1017;
      color: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 95px;
      line-height: 1.6;
    }

    .help-hint {
      font-size: 13px;
      color: #64748b;
      margin-top: 6px;
    }

    .button-row {
      display: flex;
      gap: 14px;
      margin-top: 26px;
    }

    button {
      flex: 1;
      padding: 14px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-submit {
      position: relative;
      background: rgba(18, 21, 28, 0.95);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 20px rgba(155, 114, 203, 0.4);
      overflow: visible;
      z-index: 1;
    }

    /* Conic rainbow border */
    .btn-submit::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 12px;
      padding: 2px;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #f59e0b, #4285f4);
      background-size: 200% 100%;
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rainbow-slide 3s linear infinite;
      pointer-events: none;
    }

    /* Rainbow halo */
    .btn-submit::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 14px;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #f59e0b);
      background-size: 200% 100%;
      filter: blur(10px);
      opacity: 0.6;
      z-index: -1;
      animation: rainbow-slide 3s linear infinite;
      pointer-events: none;
    }

    @keyframes rainbow-slide {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .btn-submit:hover {
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .quick-preset-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .preset-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-chip:hover {
      border-color: #9b72cb;
      color: #c4b5fd;
      background: rgba(155, 114, 203, 0.15);
    }

    .alert-toast {
      margin-top: 18px;
      padding: 12px 16px;
      background: rgba(155, 114, 203, 0.2);
      border: 1px solid rgba(155, 114, 203, 0.5);
      color: #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="controller-chassis">
    <div class="header-bar">
      <div class="header-title">
        <span>✨ GEMINI AURA OVERLAY CONTROLLER</span>
      </div>
      <div class="status-badge" id="statusBadge">AURA SYNC: OK</div>
    </div>

    <form id="controlForm">
      <div class="form-group">
        <label>Game Title</label>
        <input type="text" id="ctrlGame" value="黑神话：悟空">
        <div class="quick-preset-chips">
          <span class="preset-chip" onclick="setGame('黑神话：悟空')">黑神话</span>
          <span class="preset-chip" onclick="setGame('艾尔登法环: 黄金树幽影')">艾尔登法环</span>
          <span class="preset-chip" onclick="setGame('英雄联盟 LOL')">英雄联盟</span>
          <span class="preset-chip" onclick="setGame('无畏契约 VALORANT')">无畏契约</span>
          <span class="preset-chip" onclick="setGame('夜间电台 / 互动慢聊')">电台杂谈</span>
        </div>
      </div>

      <div class="form-group">
        <label>Marquee Notices (Newline or || separated)</label>
        <textarea id="ctrlNotices">✨ 欢迎来到直播间！点赞关注不迷路，交流群：888-666-999
🌌 每天晚上 20:00 准时开播，感谢各位老铁的大力支持！
🎮 PC最高画质全景光追 | 欢迎弹幕互动交流点歌！</textarea>
        <div class="help-hint">Each line or || delimiter will loop smoothly across the notice bar.</div>
      </div>

      <div class="form-group">
        <label>Festive Atmosphere Effect</label>
        <select id="ctrlEffect">
          <option value="none">None (Standard)</option>
          <option value="lights">Hanging Festive Holiday Lights</option>
          <option value="snow">Winter Snowfall</option>
          <option value="both">Lights + Snowfall</option>
        </select>
      </div>

      <div class="button-row">
        <button type="submit" class="btn-submit">🚀 Sync to 4K OBS Canvas</button>
      </div>

      <div class="alert-toast" id="toast">✔ Synchronized to OBS canvas</div>
    </form>
  </div>

  <script>
    const channel = new BroadcastChannel('obs_overlay_sync');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2500);
    }

    function setGame(title) {
      document.getElementById('ctrlGame').value = title;
    }

    document.getElementById('controlForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const gameTitle = document.getElementById('ctrlGame').value.trim();
      const rawNotices = document.getElementById('ctrlNotices').value;
      const themeEffect = document.getElementById('ctrlEffect').value;
      const notices = rawNotices
        .split(/\r?\n|\|\|/)
        .map(s => s.trim())
        .filter(Boolean);

      channel.postMessage({
        gameTitle,
        notices,
        themeEffect
      });

      showToast('✔ Synchronized to OBS canvas');
    });
  </script>
</body>
</html>

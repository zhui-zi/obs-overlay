<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3840, height=2160, initial-scale=1.0">
  <title>Google Gemini Aura Glow - 4K Ultra HD OBS Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 全局 SVG 渐变定义 (用于 Gemini 标志性光辉四芒星) -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <linearGradient id="gemini-sparkle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4285f4" />
        <stop offset="35%" stop-color="#9b72cb" />
        <stop offset="70%" stop-color="#d96570" />
        <stop offset="100%" stop-color="#f59e0b" />
      </linearGradient>
    </defs>
  </svg>

  <!-- 4K Gemini 悬浮光辉胶囊岛 (占据 2/3 宽度：2560px，高度：110px) -->
  <header class="overlay-container">
    
    <!-- 左侧区域：个人主页品牌舱 (keita.cc) + 纯粹极光光柱频谱 -->
    <div class="panel-section left-panel">
      <!-- keita.cc 个人主页品牌胶囊 (纯粹单行大字) -->
      <div class="live-indicator-bay brand-domain-bay">
        <div class="sparkle-housing">
          <!-- Gemini 光辉四芒星图标 -->
          <svg class="sparkle-icon" viewBox="0 0 24 24">
            <path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z"/>
          </svg>
        </div>
        <div class="live-text-group">
          <span class="brand-domain-label" id="brandDomain">keita.cc</span>
        </div>
      </div>

      <!-- 纯粹极光频谱动态量表 (无冗余文字标签) -->
      <div class="vu-meter-box">
        <div class="vu-bars">
          <div class="vu-bar"><div style="width:100%; height:20%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:30%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:45%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:60%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:35%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:50%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:65%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:75%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:40%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:20%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:15%; background:currentColor; position:absolute; bottom:0;"></div></div>
          <div class="vu-bar"><div style="width:100%; height:10%; background:currentColor; position:absolute; bottom:0;"></div></div>
        </div>
      </div>
    </div>

    <!-- 中左区域：纯粹单行游戏标题 (无多余图标，纯净大字 32px) -->
    <div class="panel-section game-panel">
      <div class="game-content-single">
        <span class="game-title" id="gameTitle">黑神话：悟空</span>
      </div>
    </div>

    <!-- 中部主区域：Gemini 无缝无限循环公告栏 (首尾相接，零空白) -->
    <div class="panel-section notice-panel">
      <!-- 纯净内嵌 公告 微胶囊 -->
      <div class="notice-badge">
        <svg class="notice-badge-icon" viewBox="0 0 24 24">
          <path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z"/>
        </svg>
        <span class="notice-badge-text">公告</span>
      </div>
      <!-- 无缝双轨跑马灯视窗 -->
      <div class="notice-viewport" id="noticeViewport">
        <div class="notice-track" id="noticeTrack">
          <!-- JS 自动克隆注入双轨内容，实现 100% 首尾连贯无限滚动 -->
        </div>
      </div>
    </div>

    <!-- 右侧区域：极简 Google 数字时钟与日期 -->
    <div class="panel-section time-panel">
      <div class="date-section">
        <span class="date-day" id="dateDay">SUN</span>
        <span class="date-calendar" id="dateCalendar">11.08</span>
      </div>

      <div class="clock-display">
        <span class="clock-digits" id="clockDigits">22:40</span>
        <span class="clock-seconds" id="clockSeconds">16</span>
      </div>
    </div>
  </header>

  <!-- 网页预览内置快捷设置抽屉 (按 'C' 切换) -->
  <div class="quick-drawer" id="quickDrawer">
    <h3>✨ Gemini Aura 配置面板 <span style="font-size:14px; color:#94a3b8;">(按 C 关闭)</span></h3>
    <label>
      游戏名称 (Game Title):
      <input type="text" id="inputGame">
    </label>
    <label>
      滚动公告 (多条用 || 分隔):
      <input type="text" id="inputNotice">
    </label>
    <div class="drawer-actions">
      <button class="btn-primary" id="btnDrawerApply">应用生效</button>
      <button id="btnDrawerClose">关闭</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

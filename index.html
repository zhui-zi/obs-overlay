<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=3840, height=2160, initial-scale=1.0">
  <title>Google Gemini Aura - 4K Ultra HD OBS Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Snowfall Canvas -->
  <canvas id="snowCanvas" class="snow-canvas"></canvas>

  <!-- SVG Gradient Definitions -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <linearGradient id="gemini-sparkle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4285f4" />
        <stop offset="35%" stop-color="#9b72cb" />
        <stop offset="70%" stop-color="#d96570" />
        <stop offset="100%" stop-color="#f59e0b" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Full-Screen Bespoke Thematic Stage Decoration Layer -->
  <div class="stage-decor-layer" id="stageDecorLayer" aria-hidden="true">

    <!-- 1. Chinese Lunar New Year Stage: Grand Flanking Palace Lanterns & Auspicious Clouds -->
    <div class="theme-stage-newyear">
      <!-- Auspicious Golden Cloud Filigree Corners -->
      <div class="cn-cloud cn-cloud-left">
        <svg viewBox="0 0 240 140" class="svg-cn-cloud">
          <defs>
            <linearGradient id="cnGoldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fef08a" />
              <stop offset="45%" stop-color="#f59e0b" />
              <stop offset="100%" stop-color="#b45309" />
            </linearGradient>
            <filter id="cnGlowL" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>
          <path d="M 12 12 C 45 12, 65 28, 80 48 C 100 32, 138 38, 152 64 C 178 54, 212 68, 222 100 C 232 130, 195 138, 170 132 C 142 126, 122 112, 108 118 C 82 128, 46 112, 36 92 C 16 92, 6 68, 16 48 C 6 38, 6 18, 12 12 Z" fill="url(#cnGoldGradL)" opacity="0.88" filter="url(#cnGlowL)"/>
          <path d="M 28 38 Q 54 22 84 44 Q 114 28 144 58 Q 174 48 196 78" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.95"/>
          <circle cx="98" cy="58" r="4" fill="#fef08a" />
          <circle cx="154" cy="78" r="3.5" fill="#fef08a" />
        </svg>
      </div>

      <div class="cn-cloud cn-cloud-right">
        <svg viewBox="0 0 240 140" class="svg-cn-cloud" style="transform: scaleX(-1);">
          <path d="M 12 12 C 45 12, 65 28, 80 48 C 100 32, 138 38, 152 64 C 178 54, 212 68, 222 100 C 232 130, 195 138, 170 132 C 142 126, 122 112, 108 118 C 82 128, 46 112, 36 92 C 16 92, 6 68, 16 48 C 6 38, 6 18, 12 12 Z" fill="url(#cnGoldGradL)" opacity="0.88" filter="url(#cnGlowL)"/>
          <path d="M 28 38 Q 54 22 84 44 Q 114 28 144 58 Q 174 48 196 78" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.95"/>
          <circle cx="98" cy="58" r="4" fill="#fef08a" />
          <circle cx="154" cy="78" r="3.5" fill="#fef08a" />
        </svg>
      </div>

      <!-- Left Grand Imperial Palace Lantern -->
      <div class="cn-palace-lantern lantern-pos-left">
        <div class="lantern-suspension-cord"></div>
        <div class="lantern-knot">
          <svg viewBox="0 0 40 40" class="svg-knot">
            <rect x="12" y="12" width="16" height="16" rx="3" transform="rotate(45 20 20)" fill="#b91c1c" stroke="#fde047" stroke-width="2.2"/>
            <circle cx="20" cy="20" r="4.2" fill="#fde047"/>
          </svg>
        </div>
        <div class="lantern-roof">
          <svg viewBox="0 0 120 40" class="svg-roof">
            <path d="M 8 38 Q 60 10 112 38 L 98 12 Q 60 4 22 12 Z" fill="#991b1b" stroke="#fde047" stroke-width="2"/>
            <circle cx="60" cy="6" r="5" fill="#fde047"/>
            <circle cx="10" cy="36" r="3.2" fill="#fde047"/>
            <circle cx="110" cy="36" r="3.2" fill="#fde047"/>
          </svg>
        </div>
        <div class="lantern-silk-globe">
          <div class="globe-ribs"></div>
          <span class="globe-seal-text">福</span>
        </div>
        <div class="lantern-base">
          <svg viewBox="0 0 90 24" class="svg-base">
            <path d="M 15 2 Q 45 22 75 2 L 65 20 Q 45 24 25 20 Z" fill="#991b1b" stroke="#fde047" stroke-width="2"/>
            <circle cx="45" cy="18" r="4" fill="#fde047"/>
          </svg>
        </div>
        <div class="lantern-tassel-cluster">
          <div class="tassel-jade-bead"></div>
          <div class="tassel-fringes">
            <div class="tassel-fringe tassel-fringe-1"></div>
            <div class="tassel-fringe tassel-fringe-2"></div>
            <div class="tassel-fringe tassel-fringe-3"></div>
          </div>
        </div>
      </div>

      <!-- Right Grand Imperial Palace Lantern -->
      <div class="cn-palace-lantern lantern-pos-right">
        <div class="lantern-suspension-cord"></div>
        <div class="lantern-knot">
          <svg viewBox="0 0 40 40" class="svg-knot">
            <rect x="12" y="12" width="16" height="16" rx="3" transform="rotate(45 20 20)" fill="#b91c1c" stroke="#fde047" stroke-width="2.2"/>
            <circle cx="20" cy="20" r="4.2" fill="#fde047"/>
          </svg>
        </div>
        <div class="lantern-roof">
          <svg viewBox="0 0 120 40" class="svg-roof">
            <path d="M 8 38 Q 60 10 112 38 L 98 12 Q 60 4 22 12 Z" fill="#991b1b" stroke="#fde047" stroke-width="2"/>
            <circle cx="60" cy="6" r="5" fill="#fde047"/>
            <circle cx="10" cy="36" r="3.2" fill="#fde047"/>
            <circle cx="110" cy="36" r="3.2" fill="#fde047"/>
          </svg>
        </div>
        <div class="lantern-silk-globe">
          <div class="globe-ribs"></div>
          <span class="globe-seal-text">春</span>
        </div>
        <div class="lantern-base">
          <svg viewBox="0 0 90 24" class="svg-base">
            <path d="M 15 2 Q 45 22 75 2 L 65 20 Q 45 24 25 20 Z" fill="#991b1b" stroke="#fde047" stroke-width="2"/>
            <circle cx="45" cy="18" r="4" fill="#fde047"/>
          </svg>
        </div>
        <div class="lantern-tassel-cluster">
          <div class="tassel-jade-bead"></div>
          <div class="tassel-fringes">
            <div class="tassel-fringe tassel-fringe-1"></div>
            <div class="tassel-fringe tassel-fringe-2"></div>
            <div class="tassel-fringe tassel-fringe-3"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Halloween Night Stage: Cobweb & Spider, Spooky Gnarled Tree with Eyes, Flying Bats & Jack-o'-Lantern -->
    <div class="theme-stage-halloween">
      <!-- Top-Left Spooky Cobweb & Dangling Spider -->
      <div class="hl-web-corner">
        <svg viewBox="0 0 340 340" class="svg-spiderweb">
          <path d="M 0 0 L 320 0 M 0 0 L 280 160 M 0 0 L 210 250 M 0 0 L 110 300 M 0 0 L 0 320" stroke="rgba(216, 180, 254, 0.45)" stroke-width="1.6" fill="none"/>
          <path d="M 90 0 Q 80 40 0 90 M 170 0 Q 145 80 0 170 M 245 0 Q 210 125 0 245 M 315 0 Q 260 180 0 315" stroke="rgba(216, 180, 254, 0.35)" stroke-width="1.3" fill="none"/>
          <path d="M 55 0 Q 50 24 0 55 M 130 0 Q 110 60 0 130 M 205 0 Q 175 100 0 205 M 280 0 Q 235 150 0 280" stroke="rgba(216, 180, 254, 0.25)" stroke-width="1.1" fill="none"/>
        </svg>
        <div class="hl-spider-anchor">
          <div class="hl-spider-thread"></div>
          <div class="hl-spider">
            <svg viewBox="0 0 36 36" class="svg-spider">
              <ellipse cx="18" cy="22" rx="7" ry="9" fill="#18181b" stroke="#a855f7" stroke-width="1.5"/>
              <circle cx="18" cy="12" r="5" fill="#27272a" stroke="#a855f7" stroke-width="1.5"/>
              <circle cx="16" cy="11" r="1.3" fill="#ef4444"/>
              <circle cx="20" cy="11" r="1.3" fill="#ef4444"/>
              <path d="M 14 12 Q 4 8 2 16 M 22 12 Q 32 8 34 16 M 14 16 Q 2 18 3 26 M 22 16 Q 34 18 33 26 M 14 20 Q 2 24 5 32 M 22 20 Q 34 24 31 32 M 15 24 Q 5 32 10 36 M 21 24 Q 31 32 26 36" stroke="#c084fc" stroke-width="1.4" fill="none"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Atmospheric Flying Bats Across Viewport -->
      <div class="hl-bat-flock">
        <div class="hl-bat bat-1">
          <svg viewBox="0 0 48 24" class="svg-bat">
            <path d="M 24 16 Q 20 6 8 8 Q 14 16 10 22 Q 18 18 24 20 Q 30 18 38 22 Q 34 16 40 8 Q 28 6 24 16 Z" fill="#09090b"/>
          </svg>
        </div>
        <div class="hl-bat bat-2">
          <svg viewBox="0 0 48 24" class="svg-bat">
            <path d="M 24 16 Q 20 6 8 8 Q 14 16 10 22 Q 18 18 24 20 Q 30 18 38 22 Q 34 16 40 8 Q 28 6 24 16 Z" fill="#09090b"/>
          </svg>
        </div>
      </div>

      <!-- Bottom-Right Glowing Jack-o'-Lantern -->
      <div class="hl-pumpkin-corner">
        <svg viewBox="0 0 160 140" class="svg-pumpkin">
          <defs>
            <radialGradient id="pumpkinSkinGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fb923c"/>
              <stop offset="70%" stop-color="#ea580c"/>
              <stop offset="100%" stop-color="#7c2d12"/>
            </radialGradient>
            <filter id="pumpkinFlameGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="6" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>
          <path d="M 75 25 Q 70 8 85 4 Q 90 12 85 24 Z" fill="#4d7c0f"/>
          <ellipse cx="80" cy="80" rx="68" ry="52" fill="url(#pumpkinSkinGrad)"/>
          <ellipse cx="80" cy="80" rx="46" ry="51" fill="none" stroke="#7c2d12" stroke-width="2.5" opacity="0.6"/>
          <ellipse cx="80" cy="80" rx="24" ry="50" fill="none" stroke="#7c2d12" stroke-width="2.5" opacity="0.6"/>
          <g class="pumpkin-candle-flame" filter="url(#pumpkinFlameGlow)">
            <polygon points="52,65 64,55 60,72" fill="#fef08a"/>
            <polygon points="108,65 96,55 100,72" fill="#fef08a"/>
            <polygon points="80,72 75,82 85,82" fill="#fef08a"/>
            <path d="M 44 92 Q 80 125 116 92 Q 106 106 98 96 Q 92 110 80 98 Q 68 110 62 96 Q 54 106 44 92 Z" fill="#fef08a"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- 3. Romantic Sakura Stage: Pure Hanafubuki Falling Blossom Atmosphere -->
    <div class="theme-stage-romantic"></div>

    <!-- 4. Winter Frost Stage: Crystalline Ice Vines in Corners -->
    <div class="theme-stage-frost">
      <div class="frost-corner frost-left">
        <svg viewBox="0 0 280 160" class="svg-frost">
          <path d="M 0 0 L 280 0 C 240 20, 200 50, 180 30 C 150 10, 130 70, 100 40 C 70 10, 60 110, 35 70 C 12 30, 22 150, 0 160 Z" fill="rgba(224, 242, 254, 0.28)" filter="drop-shadow(0 0 10px rgba(186, 230, 253, 0.7))"/>
          <polygon points="40,0 45,55 49,0" fill="rgba(255, 255, 255, 0.75)"/>
          <polygon points="100,0 104,78 108,0" fill="rgba(255, 255, 255, 0.8)"/>
          <polygon points="165,0 168,42 172,0" fill="rgba(255, 255, 255, 0.65)"/>
          <polygon points="225,0 228,30 231,0" fill="rgba(255, 255, 255, 0.55)"/>
        </svg>
      </div>
      <div class="frost-corner frost-right">
        <svg viewBox="0 0 280 160" class="svg-frost" style="transform: scaleX(-1);">
          <path d="M 0 0 L 280 0 C 240 20, 200 50, 180 30 C 150 10, 130 70, 100 40 C 70 10, 60 110, 35 70 C 12 30, 22 150, 0 160 Z" fill="rgba(224, 242, 254, 0.28)" filter="drop-shadow(0 0 10px rgba(186, 230, 253, 0.7))"/>
          <polygon points="40,0 45,55 49,0" fill="rgba(255, 255, 255, 0.75)"/>
          <polygon points="100,0 104,78 108,0" fill="rgba(255, 255, 255, 0.8)"/>
          <polygon points="165,0 168,42 172,0" fill="rgba(255, 255, 255, 0.65)"/>
          <polygon points="225,0 228,30 231,0" fill="rgba(255, 255, 255, 0.55)"/>
        </svg>
      </div>
    </div>

  </div>

  <!-- 89.2% 4K Game Viewport Frame (For Full Stage Mode: 3424x1926) -->
  <div class="game-viewport-frame" id="gameViewportFrame" aria-hidden="true"></div>

  <!-- 4K Suspended Capsule HUD / Bottom Dock -->
  <header class="overlay-container">
    
    <!-- Top Hanging Festive Holiday Garland String Lights (For 'lights' & 'both' modes) -->
    <div class="festive-lights-rig" id="festiveLights"></div>

    <!-- Thematic HUD Corner Filigree Accents -->
    <div class="hud-corner-accent hud-corner-tl"></div>
    <div class="hud-corner-accent hud-corner-tr"></div>
    
    <!-- Left Bay: Brand Domain & Spectrum VU Meter -->
    <div class="panel-section left-panel">
      <div class="live-indicator-bay brand-domain-bay">
        <div class="sparkle-housing">
          <svg class="sparkle-icon" viewBox="0 0 24 24">
            <path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z"/>
          </svg>
        </div>
        <div class="live-text-group">
          <span class="brand-domain-label" id="brandDomain">keita.cc</span>
        </div>
      </div>

      <div class="vu-meter-box">
        <div class="vu-bars" id="vuBars">
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
          <div class="vu-bar"><div class="vu-bar-fill"></div><div class="vu-bar-peak"></div></div>
        </div>
      </div>
    </div>

    <!-- Center-Left Bay: Game Title -->
    <div class="panel-section game-panel">
      <div class="game-badge" id="gameBadge" style="display: none;">
        <span class="game-badge-icon-box" id="gameBadgeIcon"></span>
        <span class="game-badge-text" id="gameBadgeText">游戏</span>
      </div>
      <div class="game-content-single">
        <span class="game-title" id="gameTitle">Just Chatting</span>
      </div>
    </div>

    <!-- Center Bay: Seamless Continuous Marquee Notice -->
    <div class="panel-section notice-panel">
      <div class="notice-badge">
        <div class="notice-badge-icon-box">
          <svg class="notice-badge-icon notice-icon-horn" viewBox="0 0 24 24" fill="none">
            <g class="notice-horn-body">
              <path d="M4 10h2l4.5 -4v12l-4.5 -4H4a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z" fill="#a78bfa" stroke="#c4b5fd" stroke-width="1.2" stroke-linejoin="round"/>
              <path d="M6 13v2.5a1.5 1.5 0 0 0 3 0V14" stroke="#c4b5fd" stroke-width="1.2" stroke-linecap="round"/>
            </g>
            <path class="notice-wave wave-1" d="M14 9a4 4 0 0 1 0 6" stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round"/>
            <path class="notice-wave wave-2" d="M17 6.5a7.5 7.5 0 0 1 0 11" stroke="#e0e7ff" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="notice-badge-text">公告</span>
      </div>
      <div class="notice-viewport" id="noticeViewport">
        <div class="notice-track" id="noticeTrack">
          <!-- Marquee items populated dynamically via script.js -->
        </div>
      </div>
    </div>

    <!-- Right Bay: Digital Clock & Date -->
    <div class="panel-section time-panel right-panel">
      <div class="date-section">
        <span class="date-day" id="dateDay">SUN</span>
        <span class="date-calendar" id="dateCalendar">11.08</span>
      </div>

      <div class="clock-display">
        <div class="clock-digits-roller" id="clockDigits">
          <div class="roll-track">
            <span class="roll-item">22:40</span>
          </div>
        </div>
        <div class="clock-seconds-roller" id="clockSeconds">
          <div class="roll-track">
            <span class="roll-item">16</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- In-browser Quick Settings Drawer (Toggle with 'C') -->
  <div class="quick-drawer" id="quickDrawer">
    <h3>✨ Gemini Aura Settings <span style="font-size:14px; color:#94a3b8;">(Press C to toggle)</span></h3>
    <label>
      Game Title:
      <input type="text" id="inputGame">
    </label>
    <label>
      Marquee Notices (Separate with ||):
      <input type="text" id="inputNotice">
    </label>
    <label>
      Layout Mode:
      <select id="inputMode">
        <option value="light">Lightweight Mode (Top Capsule HUD)</option>
        <option value="full">Full Stage Mode (Game Frame + Bottom Dock)</option>
      </select>
    </label>
    <label>
      Festive Effect:
      <select id="inputEffect">
        <option value="none">None (Standard Aura)</option>
        <option value="lights">🎄 Festive Garland Lights</option>
        <option value="snow">❄️ Winter Frost & Snowfall</option>
        <option value="both">✨ Garland Lights + Snowfall</option>
        <option value="newyear">🧧 Chinese New Year (Grand Palace Lanterns & Auspicious Gold Dust)</option>
        <option value="halloween">🎃 Halloween Night (Cobweb, Spider, Spooky Tree & Jack-o'-Lantern)</option>
        <option value="romantic">🌸 Romantic Sakura (Blooming Cherry Branches & Hanafubuki Petal Storm)</option>
      </select>
    </label>
    <div class="drawer-actions">
      <button class="btn-primary" id="btnDrawerApply">Apply</button>
      <button id="btnDrawerClose">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
